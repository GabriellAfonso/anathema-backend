# mypy configuration — Anathema backend (Django 5.2 / DRF / Channels).
#
# Invoke from the `server/` directory (where this file and manage.py live) so
# the django-stubs plugin can import `core.settings`:
#     cd server && mypy
#
# Strictness mirrors CLAUDE.md: explicit types everywhere, no untyped defs,
# no bare generics, no implicit `Any`.

[mypy]
python_version = 3.14
plugins = mypy_django_plugin.main
mypy_path = .

# Default targets so a bare `mypy` checks the whole project.
# manage.py is generated boilerplate and is intentionally excluded.
files = apps, core

# `strict` turns on the full strict family: disallow_untyped_defs,
# disallow_incomplete_defs, disallow_untyped_calls/decorators,
# disallow_any_generics (bans bare `dict`/`list`), check_untyped_defs,
# warn_return_any, warn_unused_ignores, warn_redundant_casts,
# warn_unused_configs, strict_equality, extra_checks, no_implicit_reexport.
strict = True

# Not part of `strict`: flag code paths that can never run.
warn_unreachable = True

# Actionable output.
show_error_codes = True
show_column_numbers = True
pretty = True

[mypy.plugins.django-stubs]
# Unquoted: configparser keeps quotes literal, unlike pyproject.toml.
django_settings_module = core.settings

# --- Generated migrations: not hand-typed -------------------------------
[mypy-*.migrations.*]
ignore_errors = True

# --- Third-party libs that ship no type stubs ---------------------------
# Scoped per-module rather than a global `ignore_missing_imports`, so a real
# missing import anywhere else still surfaces. simplejwt/redis/jwt ship
# py.typed; Django is covered by the django-stubs plugin.
[mypy-rest_framework.*]
ignore_missing_imports = True

[mypy-channels.*]
ignore_missing_imports = True

[mypy-channels_redis.*]
ignore_missing_imports = True
