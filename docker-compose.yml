services:
  anathema_server:
    container_name: anathema_server
    image: anathema:latest
    build:
      context: .
    # Dev-only override of the image's production CMD.
    command: [ "uvicorn", "core.asgi:application",
               "--host", "0.0.0.0", "--port", "8000",
               "--lifespan", "off", "--reload" ]
    ports:
      - "8000:8000"
    volumes:
      - ./server:/server
    depends_on:
      - anathema_redis

  anathema_redis:
    container_name: anathema_redis
    restart: unless-stopped
    image: redis:8.6.3-alpine
    ports:
      - 6379:6379
    command: [ "redis-server", "--save", "" ]
